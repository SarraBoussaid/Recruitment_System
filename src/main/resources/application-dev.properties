# Built-in database — works immediately, no MySQL needed
# Use file-backed H2 for dev so accounts persist across restarts.
spring.datasource.url=jdbc:h2:file:./data/recruitment;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-h2.sql
