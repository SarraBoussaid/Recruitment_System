spring.application.name=TuniHire

# Use the H2 dev profile by default so the app can run locally without MySQL.
# Switch to mysql once the database server is available and configured.
spring.profiles.active=dev

server.port=8082

spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/resumes
