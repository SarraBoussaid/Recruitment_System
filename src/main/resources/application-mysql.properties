# MySQL database — run database/schema.sql first
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/job_recruitment_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&connectTimeout=5000&socketTimeout=5000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Initialize the schema when the database is empty so the website can connect to MySQL tables.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-mysql.sql
# Continue startup even if SQL init scripts produce warnings (e.g. table already exists)
spring.sql.init.continue-on-error=true
